name: CI

# PRD §9.9 — lint, typecheck, tests and a dependency/security audit must all
# pass before merge. The audit step fails the build on high/critical findings;
# a step that runs the audit and ignores its exit code satisfies nothing.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Current Active LTS. Re-verify at upgrade time — never pin from a doc.
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
