<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="GeoMineX">
  <title>GeoMineX</title>
  <!--
    Standalone copy of src/components/brand/Mark.tsx, kept in sync by hand.

    It exists because some consumers cannot render a React component: the PWA
    icons and OG image are generated from this file, and anything embedded by
    URL (a future HTML email, a README) needs a real asset. In-app rendering
    should always use the component, which carries an SSR-stable unique clip id.

    No <style> element anywhere, by design — an SVG with inline CSS would need
    the per-request nonce from app/proxy.ts and would otherwise render unstyled.
  -->
  <defs>
    <clipPath id="geominex-disc">
      <circle cx="50" cy="50" r="41"/>
    </clipPath>
  </defs>

  <path d="M 42.01 4.70 A 46 46 0 0 0 42.01 95.30" fill="none" stroke="#F58220" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M 57.99 4.70 A 46 46 0 0 1 57.99 95.30" fill="none" stroke="#1E7A3C" stroke-width="4.2" stroke-linecap="round"/>

  <g clip-path="url(#geominex-disc)">
    <circle cx="50" cy="50" r="41" fill="#FFFFFF"/>

    <g fill="none" stroke="#1E88E5" stroke-width="1.3">
      <circle cx="32" cy="28" r="12.5"/>
