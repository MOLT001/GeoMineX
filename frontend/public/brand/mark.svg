      <ellipse cx="32" cy="28" rx="4.8" ry="12.5" stroke-width="1.1"/>
      <path d="M 19.5 28 H 44.5" stroke-width="1.1"/>
    </g>

    <g fill="#0B1F3A" transform="rotate(-28 72 24)">
